name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # the package ships dist/, and the manifest is what the docs option panels
      # read — poops -b exits 0 when it has nothing to compile, so check output
      - name: Verify build output
        shell: bash
        run: |
          test -s dist/book-of-elementals.js
          test -s dist/book-of-elementals.css
          test -s dist/custom-elements.json
          test -s _site/index.html

      # Browser-support gates on the emitted bundles: stylelint checks the CSS
      # against .browserslistrc, es-check confirms the JS parses at the esbuild
      # target. Both read dist/, so they only run after the build step.
      - name: Check browser compatibility
        shell: bash
        run: |
          npm run lint:browsers
          npm run lint:es

  # A job of its own rather than a step in the matrix: it needs a browser, and
  # downloading one twice to run the same audit on two versions of Node buys
  # nothing — the audit runs in Chromium, not in Node.
  a11y:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # playwright-core ships no browser, which is why it is the dependency: a
      # download on every `npm ci` in every other job is the cost of the package
      # that bundles one.
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      # The audit reads the built previews, so nothing to check before this runs.
      - name: Build
        run: npm run build

      - name: Audit the demos with axe
        run: npm run a11y
